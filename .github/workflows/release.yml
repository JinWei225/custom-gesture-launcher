# Builds and publishes a signed release APK and app bundle whenever a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The tag is the single source of the version — versionName "1.2.3" and versionCode 1002003 are
# derived from it — and the GitHub Release it creates is what Obtainium watches for updates. The
# APK is for sideloading and Obtainium (which only looks at .apk assets); the .aab is the file
# uploaded to Google Play, which takes nothing else for a new app.
# Unit tests run first; a red test means no release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits, not tags: a tag can be moved to other code, and the last step
      # runs with write access to the repository. The comment names the tag each commit was.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Derive the version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          # Three digits each for minor and patch: patches are bumped for every small change, and
          # two digits would give v1.7.100 the same code as v1.8.0.
          if [ "$minor" -gt 999 ] || [ "$patch" -gt 999 ]; then
            echo "::error::minor and patch must stay below 1000 for the versionCode scheme"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

      # The keystore itself is a base64 secret; app/build.gradle.kts reads the rest from
      # keystore.properties, the same file a local signed build uses.
      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Repository secret $var is not set — see README, 'Publishing a release'"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Test and build
        run: >
          ./gradlew testDebugUnitTest assembleRelease bundleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      # Gone before anything else runs: the signing key has no business on disk while the release
      # action, which isn't ours, works in this directory. Runs even when the build failed.
      - name: Remove the signing config
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Name the APK and bundle
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "gessearch-launcher-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "gessearch-launcher-${{ steps.version.outputs.name }}.aab"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.version.outputs.name }}
          files: |
            gessearch-launcher-*.apk
            gessearch-launcher-*.aab
          generate_release_notes: true
